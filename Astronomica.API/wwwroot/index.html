<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astronómica - Explorador del Sistema Solar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #050714;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow-x: hidden;
        }

        .space-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .glass {
            background: rgba(13, 22, 45, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(17, 27, 56, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

            .glass-card:hover {
                transform: translateY(-5px);
                border-color: rgba(129, 140, 248, 0.6);
                box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <canvas id="starsCanvas" class="space-canvas"></canvas>

    <!-- Navbar -->
    <header class="glass sticky top-0 z-40 border-b border-indigo-500/20 px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-planet-ringed text-white text-xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-indigo-200 via-sky-300 to-indigo-400">ASTRONÓMICA</h1>
                <p class="text-xs text-indigo-300/70">Plataforma Educativa Espacial</p>
            </div>
        </div>

        <!-- Navegación y Sesión -->
        <div class="flex items-center space-x-4">
            <div id="sessionIndicator" class="hidden items-center space-x-3 bg-indigo-950/60 px-4 py-2 rounded-full border border-indigo-500/30">
                <span class="text-xs text-indigo-200">Hola, <b id="userNameDisplay" class="text-white capitalize">Usuario</b></span>
                <span id="roleBadge" class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-indigo-600 text-indigo-100">Rol</span>
            </div>

            <!-- Pestañas para Admin -->
            <nav id="adminNav" class="hidden flex space-x-2">
                <button onclick="cambiarVista('planetas')" id="btnNavPlanetas" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600/40 text-white border border-indigo-400/30">
                    <i class="fa-solid fa-globe mr-1"></i> Planetas
                </button>
                <button onclick="cambiarVista('astronomos')" id="btnNavAstronomos" class="px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-600/30 text-indigo-200 border border-transparent">
                    <i class="fa-solid fa-user-astronaut mr-1"></i> Astrónomos
                </button>
            </nav>

            <button id="authBtn" onclick="toggleAuthModal()" class="px-4 py-2 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-medium text-sm transition shadow-lg shadow-indigo-600/20 flex items-center space-x-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span id="authBtnText">Iniciar Sesión</span>
            </button>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 space-y-8">

        <!-- SECCIÓN PLANETAS -->
        <section id="seccionPlanetas" class="space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass p-6 rounded-2xl border border-indigo-500/20">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-shuttle-space text-indigo-400"></i> Catálogo de Planetas
                    </h2>
                    <p class="text-sm text-indigo-200/80">Datos cargados en tiempo real desde la API del backend</p>
                </div>

                <div class="flex items-center space-x-3">
                    <button id="btnCrearPlaneta" onclick="abrirModalPlaneta()" class="hidden px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium shadow-lg shadow-emerald-600/20 transition flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus"></i> Nuevo Planeta
                    </button>
                    <button onclick="cargarPlanetas()" class="p-2.5 rounded-xl glass hover:bg-indigo-600/30 text-indigo-200 transition" title="Refrescar datos">
                        <i class="fa-solid fa-rotate-right"></i>
                    </button>
                </div>
            </div>

            <!-- Grid de planetas -->
            <div id="gridPlanetas" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Renderizado dinámico -->
            </div>
        </section>

        <!-- SECCIÓN GESTIÓN ASTRÓNOMOS (Sólo Admin) -->
        <section id="seccionAstronomos" class="hidden space-y-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 glass p-6 rounded-2xl border border-indigo-500/20">
                <div>
                    <h2 class="text-2xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-users-gear text-purple-400"></i> Administración de Astrónomos
                    </h2>
                    <p class="text-sm text-indigo-200/80">Gestión de credenciales y permisos científicos</p>
                </div>

                <button onclick="abrirModalCrearAstronomo()" class="px-4 py-2 rounded-xl bg-purple-600 hover:bg-purple-500 text-white text-sm font-medium shadow-lg shadow-purple-600/20 transition flex items-center gap-2">
                    <i class="fa-solid fa-user-plus"></i> Crear Astrónomo
                </button>
            </div>

            <!-- Tabla de astrónomos -->
            <div class="glass rounded-2xl overflow-hidden border border-indigo-500/20">
                <table class="w-full text-left text-sm text-indigo-200">
                    <thead class="bg-indigo-950/80 text-xs uppercase text-indigo-300 font-semibold tracking-wider border-b border-indigo-500/20">
                        <tr>
                            <th class="px-6 py-4">ID</th>
                            <th class="px-6 py-4">Usuario</th>
                            <th class="px-6 py-4">Rol</th>
                            <th class="px-6 py-4 text-right">Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tablaAstronomosBody" class="divide-y divide-indigo-500/10">
                        <!-- Renderizado dinámico -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- MODAL: LOGIN -->
    <div id="modalLogin" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-2xl p-8 border border-indigo-500/30 space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-key text-indigo-400"></i> Autenticación
                </h3>
                <button onclick="toggleAuthModal()" class="text-indigo-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="formLogin" onsubmit="ejecutarLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Usuario</label>
                    <input type="text" id="loginUsuario" required class="w-full px-4 py-2.5 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm" placeholder="admin, astronomo o estudiante">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Contraseña</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm" placeholder="••••••••">
                </div>
                <div id="loginError" class="hidden text-xs text-rose-400 bg-rose-950/50 p-2.5 rounded-lg border border-rose-500/30"></div>
                <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium text-sm hover:opacity-90 transition">Ingresar</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CREAR / EDITAR PLANETA -->
    <div id="modalPlaneta" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass max-w-lg w-full rounded-2xl p-8 border border-indigo-500/30 space-y-6">
            <div class="flex justify-between items-center">
                <h3 id="tituloModalPlaneta" class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-planet-ringed text-emerald-400"></i> Registrar Planeta
                </h3>
                <button onclick="cerrarModalPlaneta()" class="text-indigo-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="formPlaneta" onsubmit="guardarPlaneta(event)" class="space-y-4">
                <input type="hidden" id="planetaId">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Nombre</label>
                    <input type="text" id="planetaNombre" required class="w-full px-4 py-2 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Tipo</label>
                    <input type="text" id="planetaTipo" required class="w-full px-4 py-2 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm" placeholder="Rocoso, Gigante Gaseoso, etc.">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Cantidad de Lunas</label>
                    <input type="number" id="planetaLunas" min="0" required class="w-full px-4 py-2 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Curiosidad</label>
                    <textarea id="planetaCuriosidad" rows="3" required class="w-full px-4 py-2 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm"></textarea>
                </div>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="planetaAnillos" class="rounded bg-indigo-950 border-indigo-500/30 text-indigo-600 focus:ring-0">
                    <label for="planetaAnillos" class="text-sm text-indigo-200">¿Posee sistema de anillos?</label>
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-medium text-sm hover:bg-emerald-500 transition">Guardar en Base de Datos</button>
            </form>
        </div>
    </div>

    <!-- MODAL: CREAR ASTRÓNOMO (Solo Admin) -->
    <div id="modalAstronomo" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-md hidden flex items-center justify-center p-4">
        <div class="glass max-w-md w-full rounded-2xl p-8 border border-indigo-500/30 space-y-6">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-user-astronaut text-purple-400"></i> Nuevo Astrónomo
                </h3>
                <button onclick="cerrarModalAstronomo()" class="text-indigo-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <form id="formAstronomo" onsubmit="guardarAstronomo(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Nombre de Usuario</label>
                    <input type="text" id="astronomoUsuario" required class="w-full px-4 py-2.5 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-indigo-300 mb-1">Contraseña</label>
                    <input type="password" id="astronomoPassword" required class="w-full px-4 py-2.5 rounded-xl bg-indigo-950/60 border border-indigo-500/30 text-white focus:outline-none focus:border-indigo-400 text-sm">
                </div>
                <button type="submit" class="w-full py-3 rounded-xl bg-purple-600 text-white font-medium text-sm hover:bg-purple-500 transition">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <!-- Lógica JavaScript Conectada a la API Real -->
    <script>
        // Variables de sesión
        let token = localStorage.getItem('jwt_token') || null;
        let usuarioActual = localStorage.getItem('usuario_nombre') || null;
        let rolActual = localStorage.getItem('usuario_rol') || null;

        // Configuración de canvas de estrellas de fondo
        const canvas = document.getElementById('starsCanvas');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            stars = Array.from({ length: 120 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 1.5,
                alpha: Math.random(),
                speed: 0.005 + Math.random() * 0.015
            }));
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                const opacity = (Math.sin(s.alpha) + 1) / 2;
                ctx.fillStyle = `rgba(255, 255, 255, ${opacity * 0.8})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            requestAnimationFrame(renderStars);
        }
        renderStars();

        // Actualizar interfaz según el rol
        function actualizarUI() {
            const sessionIndicator = document.getElementById('sessionIndicator');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const roleBadge = document.getElementById('roleBadge');
            const authBtnText = document.getElementById('authBtnText');
            const btnCrearPlaneta = document.getElementById('btnCrearPlaneta');
            const adminNav = document.getElementById('adminNav');

            if (token && usuarioActual) {
                sessionIndicator.classList.remove('hidden');
                sessionIndicator.classList.add('flex');
                userNameDisplay.innerText = usuarioActual;
                roleBadge.innerText = rolActual || 'Usuario';
                authBtnText.innerText = 'Cerrar Sesión';

                if (rolActual === 'Astronomo' || rolActual === 'Admin') {
                    btnCrearPlaneta.classList.remove('hidden');
                } else {
                    btnCrearPlaneta.classList.add('hidden');
                }

                if (rolActual === 'Admin') {
                    adminNav.classList.remove('hidden');
                } else {
                    adminNav.classList.add('hidden');
                }
            } else {
                sessionIndicator.classList.add('hidden');
                sessionIndicator.classList.remove('flex');
                authBtnText.innerText = 'Iniciar Sesión';
                btnCrearPlaneta.classList.add('hidden');
                adminNav.classList.add('hidden');
                cambiarVista('planetas');
            }
        }

        // Navegación entre planetas y astrónomos (Admin)
        function cambiarVista(vista) {
            const secPlanetas = document.getElementById('seccionPlanetas');
            const secAstronomos = document.getElementById('seccionAstronomos');
            const btnPlanetas = document.getElementById('btnNavPlanetas');
            const btnAstronomos = document.getElementById('btnNavAstronomos');

            if (vista === 'planetas') {
                secPlanetas.classList.remove('hidden');
                secAstronomos.classList.add('hidden');
                btnPlanetas.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600/40 text-white border border-indigo-400/30';
                btnAstronomos.className = 'px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-600/30 text-indigo-200 border border-transparent';
                cargarPlanetas();
            } else {
                secPlanetas.classList.add('hidden');
                secAstronomos.classList.remove('hidden');
                btnAstronomos.className = 'px-3 py-1.5 rounded-lg text-sm font-medium bg-indigo-600/40 text-white border border-indigo-400/30';
                btnPlanetas.className = 'px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-indigo-600/30 text-indigo-200 border border-transparent';
                cargarAstronomos();
            }
        }

        // Modal de Login
        function toggleAuthModal() {
            if (token) {
                // Logout
                token = null;
                usuarioActual = null;
                rolActual = null;
                localStorage.clear();
                actualizarUI();
                cargarPlanetas();
            } else {
                document.getElementById('modalLogin').classList.toggle('hidden');
                document.getElementById('loginError').classList.add('hidden');
            }
        }

        // Ejecutar Login contra /api/Auth/login
        async function ejecutarLogin(e) {
            e.preventDefault();
            const nombreUsuario = document.getElementById('loginUsuario').value.trim();
            const contrasena = document.getElementById('loginPassword').value.trim();
            const errorDiv = document.getElementById('loginError');

            try {
                const response = await fetch('/api/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombreUsuario, contrasena })
                });

                if (!response.ok) {
                    throw new Error('Credenciales inválidas');
                }

                const data = await response.json();
                token = data.mensaje;
                usuarioActual = data.nombreUsuario;
                rolActual = data.rol;

                localStorage.setItem('jwt_token', token);
                localStorage.setItem('usuario_nombre', usuarioActual);
                localStorage.setItem('usuario_rol', rolActual);

                document.getElementById('modalLogin').classList.add('hidden');
                document.getElementById('formLogin').reset();
                actualizarUI();
                cargarPlanetas();
            } catch (err) {
                errorDiv.innerText = err.message || 'Error al conectar con la API';
                errorDiv.classList.remove('hidden');
            }
        }

        // CARGAR PLANETAS desde /api/Planetas/ObtenerTodosLosPlanetas
        // CARGAR PLANETAS desde /api/Planetas/ObtenerTodosLosPlanetas
        async function cargarPlanetas() {
            const grid = document.getElementById('gridPlanetas');

            // Si no ha iniciado sesión y la API requiere autenticación
            if (!token) {
                grid.innerHTML = `
          <div class="col-span-full text-center py-12 glass rounded-2xl border border-indigo-500/30 text-indigo-300">
            <i class="fa-solid fa-user-lock text-3xl mb-3 text-indigo-400"></i>
            <h3 class="text-lg font-bold text-white">Inicia sesión para explorar</h3>
            <p class="text-xs text-indigo-300/80 mt-1">Debes identificarte como Estudiante, Astrónomo o Administrador para consultar el catálogo espacial.</p>
            <button onclick="toggleAuthModal()" class="mt-4 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold transition">
              Iniciar Sesión
            </button>
          </div>
        `;
                return;
            }

            grid.innerHTML = '<div class="col-span-full py-12 text-center text-indigo-300"><i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i><p>Consultando base de datos espacial...</p></div>';

            try {
                // Se envía el Bearer Token que se obtuvo en el login
                const res = await fetch('/api/Planetas/ObtenerTodosLosPlanetas', {
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });

                if (!res.ok) {
                    throw new Error('Error ' + res.status + ': Acceso denegado o sesión expirada');
                }

                const planetas = await res.json();

                grid.innerHTML = '';
                if (planetas.length === 0) {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-indigo-400">No hay planetas registrados en ContextoDatos.</div>';
                    return;
                }

                planetas.forEach(p => {
                    const card = document.createElement('div');
                    card.className = 'glass-card p-6 rounded-2xl flex flex-col justify-between space-y-4';

                    const tienePermisos = (rolActual === 'Astronomo' || rolActual === 'Admin');

                    card.innerHTML = `
            <div>
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-indigo-400 bg-indigo-950/80 px-2.5 py-1 rounded-md border border-indigo-500/20">
                  ${p.tipo}
                </span>
                <span class="text-xs text-indigo-300">ID: #${p.id}</span>
              </div>
              <h3 class="text-xl font-bold text-white tracking-wide">${p.nombre}</h3>
              <p class="text-xs text-indigo-200/80 mt-2 leading-relaxed">${p.curiosidad}</p>
            </div>

            <div class="pt-4 border-t border-indigo-500/10 space-y-3">
              <div class="flex justify-between text-xs text-indigo-300">
                <span><i class="fa-solid fa-moon mr-1 text-slate-400"></i> Lunas: <b>${p.cantidadLunas}</b></span>
                <span><i class="fa-solid fa-circle-notch mr-1 text-amber-400"></i> Anillos: <b>${p.tieneAnillos ? 'Sí' : 'No'}</b></span>
              </div>

              ${tienePermisos ? `
                <div class="flex justify-end space-x-2 pt-2">
                  <button onclick="editarPlaneta(${p.id}, '${p.nombre}', '${p.tipo}', ${p.cantidadLunas}, '${p.curiosidad.replace(/'/g, "\\'")}', ${p.tieneAnillos})" class="px-2.5 py-1 text-xs rounded-lg bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-400/30 transition">
                    <i class="fa-solid fa-pen-to-square"></i> Editar
                  </button>
                  <button onclick="eliminarPlaneta(${p.id})" class="px-2.5 py-1 text-xs rounded-lg bg-rose-600/30 hover:bg-rose-600/50 text-rose-200 border border-rose-400/30 transition">
                    <i class="fa-solid fa-trash"></i> Eliminar
                  </button>
                </div>
              ` : ''}
            </div>
          `;
                    grid.appendChild(card);
                });
            } catch (err) {
                grid.innerHTML = `
          <div class="col-span-full text-center py-12 glass rounded-2xl border border-rose-500/30 text-rose-300">
            <i class="fa-solid fa-triangle-exclamation text-3xl mb-2 text-rose-400"></i>
            <p class="font-semibold">${err.message}</p>
            <p class="text-xs text-rose-300/70 mt-1">Cierra sesión y vuelve a ingresar para renovar el token de seguridad.</p>
          </div>
        `;
            }
        }

        // GESTIÓN DE PLANETAS (Crear / Editar / Eliminar)
        function abrirModalPlaneta() {
            document.getElementById('planetaId').value = '';
            document.getElementById('formPlaneta').reset();
            document.getElementById('tituloModalPlaneta').innerHTML = '<i class="fa-solid fa-planet-ringed text-emerald-400"></i> Registrar Planeta';
            document.getElementById('modalPlaneta').classList.remove('hidden');
        }

        function cerrarModalPlaneta() {
            document.getElementById('modalPlaneta').classList.add('hidden');
        }

        function editarPlaneta(id, nombre, tipo, lunas, curiosidad, anillos) {
            document.getElementById('planetaId').value = id;
            document.getElementById('planetaNombre').value = nombre;
            document.getElementById('planetaTipo').value = tipo;
            document.getElementById('planetaLunas').value = lunas;
            document.getElementById('planetaCuriosidad').value = curiosidad;
            document.getElementById('planetaAnillos').checked = anillos;

            document.getElementById('tituloModalPlaneta').innerHTML = '<i class="fa-solid fa-pen-to-square text-indigo-400"></i> Editar Planeta #' + id;
            document.getElementById('modalPlaneta').classList.remove('hidden');
        }

        async function guardarPlaneta(e) {
            e.preventDefault();
            const id = document.getElementById('planetaId').value;
            const dto = {
                nombre: document.getElementById('planetaNombre').value,
                tipo: document.getElementById('planetaTipo').value,
                cantidadLunas: parseInt(document.getElementById('planetaLunas').value, 10),
                curiosidad: document.getElementById('planetaCuriosidad').value,
                tieneAnillos: document.getElementById('planetaAnillos').checked
            };

            const url = id ? `/api/Planetas/${id}` : '/api/Planetas';
            const metodo = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify(dto)
                });

                if (!res.ok) throw new Error('Error al guardar el planeta');
                cerrarModalPlaneta();
                cargarPlanetas();
            } catch (err) {
                alert(err.message);
            }
        }

        async function eliminarPlaneta(id) {
            if (!confirm('¿Estás seguro de eliminar este planeta de la lista?')) return;
            try {
                const res = await fetch(`/api/Planetas/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + token
                    }
                });
                if (!res.ok) throw new Error('No se pudo eliminar el planeta');
                cargarPlanetas();
            } catch (err) {
                alert(err.message);
            }
        }

        // GESTIÓN DE ASTRÓNOMOS (Solo Admin)
        async function cargarAstronomos() {
            const tbody = document.getElementById('tablaAstronomosBody');
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-indigo-300">Cargando astrónomos...</td></tr>';

            try {
                const res = await fetch('/api/Usuarios/ObtenerAstronomos', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) throw new Error('No autorizado');
                const lista = await res.json();

                tbody.innerHTML = '';
                lista.forEach(u => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-indigo-900/20 transition';
                    row.innerHTML = `
                <td class="px-6 py-4 font-mono text-xs text-indigo-400">#${u.id}</td>
                <td class="px-6 py-4 font-medium text-white">${u.nombreUsuario}</td>
                <td class="px-6 py-4"><span class="px-2 py-0.5 rounded-full bg-purple-900/60 text-purple-300 text-xs border border-purple-500/20">${u.rol}</span></td>
                <td class="px-6 py-4 text-right">
                  <button onclick="eliminarAstronomo(${u.id})" class="text-rose-400 hover:text-rose-300 p-1.5 rounded-lg hover:bg-rose-950/40 transition" title="Eliminar cuenta">
                    <i class="fa-solid fa-trash-can"></i>
                  </button>
                </td>
              `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="4" class="text-center py-6 text-rose-400">No se pudieron cargar los usuarios. Verifica tu sesión de Admin.</td></tr>';
            }
        }

        function abrirModalCrearAstronomo() {
            document.getElementById('formAstronomo').reset();
            document.getElementById('modalAstronomo').classList.remove('hidden');
        }

        function cerrarModalAstronomo() {
            document.getElementById('modalAstronomo').classList.add('hidden');
        }

        async function guardarAstronomo(e) {
            e.preventDefault();
            const nombreUsuario = document.getElementById('astronomoUsuario').value.trim();
            const contrasena = document.getElementById('astronomoPassword').value.trim();

            try {
                const res = await fetch('/api/Usuarios/CrearAstronomo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ nombreUsuario, contrasena })
                });

                if (!res.ok) throw new Error('Error al registrar astrónomo');
                cerrarModalAstronomo();
                cargarAstronomos();
            } catch (err) {
                alert(err.message);
            }
        }

        async function eliminarAstronomo(id) {
            if (!confirm('¿Deseas revocar el acceso a este astrónomo?')) return;
            try {
                const res = await fetch(`/api/Usuarios/EliminarAstronomo/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (!res.ok) throw new Error('Error al eliminar');
                cargarAstronomos();
            } catch (err) {
                alert(err.message);
            }
        }

        // Inicialización automática
        actualizarUI();
        cargarPlanetas();
    </script>
</body>
</html>
